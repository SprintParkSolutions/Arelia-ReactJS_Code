<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/Logos/Arelia.png" />
    <link rel="apple-touch-icon" href="/images/Logos/Arelia.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Show the same loader before JavaScript starts on every entry route. -->
    <link rel="stylesheet" href="/src/components/loader/Loader.css" />
    <noscript><style>.loader { display: none !important; }</style></noscript>
    <meta
      name="description"
      content="Arelia Space is a premium interior design company in Kondapur, Hyderabad, delivering residential, commercial and hospitality interiors with transparent budgeting and digital project tracking."
    />
    <meta property="og:title" content="Arelia Space | Premium Interior Designers in Hyderabad" />
    <meta
      property="og:description"
      content="Premium residential, commercial and hospitality interiors in Hyderabad, delivered with transparent budgeting and digital project tracking."
    />
    <meta property="og:type" content="website" />
    <!-- Google tag (gtag.js) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;

      var analyticsConsent = 'denied';
      var functionalityConsent = 'denied';
      try {
        var savedConsent = JSON.parse(localStorage.getItem('arelia-cookie-consent'));
        analyticsConsent = savedConsent && savedConsent.analytics ? 'granted' : 'denied';
        functionalityConsent = savedConsent && savedConsent.functional ? 'granted' : 'denied';
      } catch (error) {
        analyticsConsent = 'denied';
        functionalityConsent = 'denied';
      }

      gtag('consent', 'default', {
        analytics_storage: analyticsConsent,
        functionality_storage: functionalityConsent,
        security_storage: 'granted',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied'
      });
      gtag('js', new Date());
      gtag('config', 'G-78NQ11MXCG', { send_page_view: false });
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-78NQ11MXCG"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "@id": "https://areliaspace.com/#business",
        "name": "Arelia Space",
        "url": "https://areliaspace.com/",
        "image": "https://areliaspace.com/images/Hyderabad/hyderabad-living-concept-v2.webp",
        "logo": "https://areliaspace.com/images/Logos/Arelia_Logo.webp",
        "sameAs": ["https://www.instagram.com/areliaspace/", "https://www.linkedin.com/company/areliaspace/"],
        "telephone": "+91-72078-45556",
        "email": "info@areliaspace.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Unit No 1204, Forest Department, Asian Sun City, Block B, Kondapur",
          "addressLocality": "Hyderabad",
          "addressRegion": "Telangana",
          "postalCode": "500084",
          "addressCountry": "IN"
        },
        "areaServed": "Hyderabad",
        "description": "Premium residential, commercial and hospitality interior design with transparent budgeting, digital project tracking and end-to-end execution."
      }
    </script>
    <title>Arelia Space | Premium Interior Designers in Hyderabad</title>
  </head>
  <body>
    <div id="root">
      <div class="loader loader--boot" aria-live="polite" aria-label="Preparing your private client portal">
        <div class="loader__grain" aria-hidden="true"></div>
        <div class="loader__content">
          <div class="loader__logo-container">
            <img src="/images/Logos/Arelia_Logo.webp" alt="Arelia Loading" class="loader__logo" decoding="async" fetchpriority="high" />
            <div class="loader__logo-glow" style="opacity: 0"></div>
          </div>
          <div class="loader__bar-container">
            <div class="loader__bar">
              <div class="loader__bar-fill" style="width: 0%"><span class="loader__bar-highlight"></span></div>
            </div>
            <p class="loader__progress">0%</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
